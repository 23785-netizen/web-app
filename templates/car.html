{% extends "layout.html" %}
{% block body %}
<!-- just one ship! -->
 <!-- two column grid -->
<div class="two-column">
    <!-- image on left -->
    <img src="{{ ship[6] }}" alt="{{ ship[2] }}">
    <!-- info panel -->
     <div class="info">
        <h1>Top Speed: {{ ship[3] }}mph</h1>
        <h1>Cost: ${{ ship[4] }}</h1>
        <h1>Description</h1>
        <h1>{{ ship[5] }}</h1>
     </div>
</div>
{% endblock %}
